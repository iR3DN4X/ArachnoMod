<!doctype html>
<meta charset="utf-8">
<title>Mob checks</title>
<script type="importmap">{ "imports": { "@minecraft/server": "/test/mcstub.js", "@minecraft/server-ui": "/test/mcuistub.js" } }</script>
<pre id="out">running...</pre>
<script type="module">
  // The spider as a MOB (the Java mod's v1.0-v1.2 features) through the real main.js over the stub:
  // one ?case= per page load (mobsuite.html runs them all). Each case prints PASS/FAIL lines.
  const out = document.getElementById("out");
  const params = new URLSearchParams(location.search);
  const CASE = params.get("case") || "spawn";
  const lines = [];
  const check = (name, ok, detail = "") => lines.push(`${ok ? "PASS" : "FAIL"} ${name}${detail ? "  (" + detail + ")" : ""}`);
  try {
    const { __test: T, FLOOR: F } = await import("@minecraft/server");
    const main = await import("/main.js");
    const { setConfig, CONFIG } = await import("/config.js");
    const { TEXTURES } = await import("/camo_table.js");
    const sm = main.__spawnManager;
    const spiders = () => [...main.__controllers.values()];
    const live = (type) => T.MockEntity.all.filter((e) => e.isValid && e.typeId === type);
    const hdist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
    T.player.location = { x: 0.5, y: F, z: 0.5 };
    T.setView({ x: 1, y: 0, z: 0 });
    const spawnHere = (variant = "") => { T.fire("arachno:spawn", variant); return spiders()[spiders().length - 1]; };


    if (CASE === "spawn") {
      T.tick(1);
      check("no spider at first", spiders().length === 0);
      check("first-spawn timer ~1 minute", sm.respawnTimer >= 1199 && sm.respawnTimer <= 1201, `timer=${sm.respawnTimer}`);
      T.tick(1210);
      const s = spiders()[0];
      check("a spider spawned about a minute in", spiders().length === 1 && live("arachno:spider").length === 1);
      if (s) {
        const d = hdist(s.entity.location, T.player.location);
        check("spawned 30-34 blocks away", d >= 29.9 && d <= 34.1, `d=${d.toFixed(1)}`);
        check("legs drawn", s.renderer.liveCount() === s.body.legs.length, `${s.renderer.liveCount()}/${s.body.legs.length}`);
        const maxHp = { netherite: 350, camo: 600, poison: 500, hunter: 400 }[s.variant];
        check("health = variant max", Math.abs(s.entity.getComponent("minecraft:health").currentValue - maxHp) < 1e-6, `${s.variant} hp=${s.entity.getComponent("minecraft:health").currentValue}`);
        const at = s.entity.location, b = s.body.position;
        check("hitbox follows the body", Math.hypot(at.x - b.x, at.y - b.y, at.z - b.z) < 1e-3);
      }
    } else if (CASE === "chasebite") {
      const s = spawnHere();
      const biteTicks = [];
      for (let t = 1; t <= 600; t++) { const before = T.player.bites; T.tick(1); if (T.player.bites > before) biteTicks.push(t); }
      check("it hunts you down and bites", biteTicks.length >= 2, `bites at ${biteTicks.slice(0, 5).join(",")}`);
      const gaps = biteTicks.slice(1).map((t, i) => t - biteTicks[i]);
      check("one bite every 3 s (attackCooldownTicks 60)", gaps.length > 0 && gaps.every((g) => g >= 60), `gaps ${gaps.slice(0, 5).join(",")}`);
      check("bite is 6 hearts (12) as an entity attack", T.log.some((l) => l.startsWith("player hurt 12 (entityAttack) by arachno:spider")));
      T.player.location = { x: 400.5, y: F, z: 0.5 };
      const bites0 = T.player.bites;
      T.tick(200);
      check("no bite out of reach", T.player.bites === bites0);
    } else if (CASE === "armour") {
      const n = spawnHere();
      T.tick(2);
      const hp = () => n.entity.getComponent("minecraft:health").currentValue;
      let h0 = hp(); n.entity.applyDamage(7, { cause: "entityAttack" });
      check("netherite suit soaks a sword hit (7 -> ~1.79)", Math.abs((h0 - hp()) - 1.792) < 0.01, `took ${(h0 - hp()).toFixed(3)}`);
      h0 = hp(); n.entity.applyDamage(4, { cause: "lava" });
      check("netherite takes no lava damage", hp() === h0);
      h0 = hp(); n.entity.applyDamage(4, { cause: "magic" });
      check("armour doesn't stop magic", Math.abs((h0 - hp()) - 4) < 1e-9);
      h0 = hp(); n.entity.applyDamage(5, { cause: "fall" });
      check("no fall damage", hp() === h0);
      const c = spawnHere("camo");
      T.tick(2);
      const hc = () => c.entity.getComponent("minecraft:health").currentValue;
      check("camo has 600 hp", hc() === 600);
      let c0 = hc(); c.entity.applyDamage(7, { cause: "entityAttack" });
      check("camo takes the full hit", Math.abs((c0 - hc()) - 7) < 1e-9);
      c0 = hc(); c.entity.applyDamage(4, { cause: "lava" });
      check("camo burns in lava", Math.abs((c0 - hc()) - 4) < 1e-9);
      c.entity.fireTicks = 100;
      const p0 = T.counts.particles || 0;
      T.tick(9);
      check("a burning camo shows flames", (T.counts.particles || 0) - p0 >= 3, `${(T.counts.particles || 0) - p0} particles`);
    } else if (CASE === "kill") {
      setConfig("netheriteDropChance", 1);
      const s = spawnHere();
      T.tick(40);
      const legEntities = live("arachno:leg").length;
      s.entity.applyDamage(100000, { cause: "entityAttack" });
      T.tick(2);
      check("controller gone after death", spiders().length === 0);
      const item = T.log.find((l) => l.startsWith("item minecraft:netherite_ingot"));
      check("netherite trophy dropped", !!item, item || "none");
      const y = item ? parseFloat(item.split(",")[1]) : NaN;
      check("trophy on the floor beneath the body", Math.abs(y - (F + 0.25)) < 0.01, `y=${y} floor=${F}`);
      check("legs removed", live("arachno:leg").length === 0, `had ${legEntities}`);
      check("next spider in 40 minutes", sm.respawnTimer >= 47990 && sm.respawnTimer <= 48000, `timer=${sm.respawnTimer}`);
      const w = (await import("@minecraft/server")).world;
      w.difficulty = "Peaceful"; T.tick(5); w.difficulty = "Normal"; T.tick(2);
      check("Peaceful can't shortcut a kill's cooldown", sm.respawnTimer > 47000, `timer=${sm.respawnTimer}`);
    } else if (CASE === "peaceful") {
      const w = (await import("@minecraft/server")).world;
      spawnHere();
      T.tick(5);
      w.difficulty = "Peaceful";
      T.tick(3);
      check("Peaceful removes it", spiders().length === 0 && live("arachno:spider").length === 0 && live("arachno:leg").length === 0);
      T.tick(2000);
      check("no spawns during Peaceful", spiders().length === 0);
      w.difficulty = "Normal";
      T.tick(2);
      check("returns ~1 minute after peace ends", sm.respawnTimer >= 1195 && sm.respawnTimer <= 1200, `timer=${sm.respawnTimer}`);
      T.tick(1220);
      check("...and it does", spiders().length === 1);
    } else if (CASE === "tame") {
      const s = spawnHere();
      T.tick(2);
      const ev = T.interact(s.entity, "arachno:spider_tamer");
      T.tick(1);
      check("Spider Tamer tames it", s.tamed && ev.cancel && s.entity.groups.has("arachno:saddle"));
      check("tamed: hearts + level-up sound", (T.counts.particles || 0) >= 9 && T.log.includes("sound random.levelup"));
      const bites0 = T.player.bites;
      T.tick(400);
      check("a tamed spider never bites", T.player.bites === bites0);
      T.interact(s.entity, null);
      T.tick(1);
      check("empty hand climbs on", s.currentRider() === T.player);
      T.tick(60);
      check("ridden: it shrinks to riddenSize 2", Math.abs(s.body.sizeScale - 2) < 0.05, `size ${s.body.sizeScale.toFixed(2)}`);
      const x0 = s.body.position.x;
      T.player.move = { x: 0, y: 1 };   // forward, looking +x
      T.tick(60);
      check("forward walks it where you look (+x)", s.body.position.x - x0 > 3, `moved ${(s.body.position.x - x0).toFixed(1)}`);
      const z0 = s.body.position.z;
      T.player.move = { x: 1, y: 0 };   // strafe left: looking +x, left is -z
      T.tick(40);
      check("strafe moves it sideways", Math.abs(s.body.position.z - z0) > 2, `dz ${(s.body.position.z - z0).toFixed(1)}`);
      // if moving the mob ever knocks the rider off, they go straight back on, every tick
      T.MockEntity.unseatOnTeleport = true;
      const tp0 = s.entity.teleports;
      T.player.move = { x: 0, y: 1 };
      let unseatedTicks = 0;
      for (let t = 0; t < 40; t++) { T.tick(1); if (s.currentRider() !== T.player) unseatedTicks++; }
      T.MockEntity.unseatOnTeleport = false;
      check("a teleport that knocks you off puts you straight back", s.entity.teleports - tp0 > 30 && unseatedTicks === 0,
        `teleports ${s.entity.teleports - tp0}, off for ${unseatedTicks} ticks`);
      // getting off yourself: Bedrock's dismount key is NOT a Sneak press, so nothing hints at it -
      // the rider is simply gone. They stay off, even while it walks after them (round 18 bug: put back on).
      s.entity.riders = []; T.player.ridingOn = null;
      T.player.move = { x: 0, y: 0 };
      T.player.location = { x: s.body.position.x + 12, y: F, z: s.body.position.z };
      const tp1 = s.entity.teleports;
      let reseated = 0;
      for (let t = 0; t < 100; t++) { T.tick(1); if (s.currentRider()) reseated++; }
      check("getting off yourself (no Sneak press) keeps you off", reseated === 0 && s.entity.teleports - tp1 > 30,
        `re-seated ${reseated} ticks, teleports ${s.entity.teleports - tp1}`);
      // crouching doesn't climb on (like the entity's own crouching_skip_interact); standing does
      T.player.location = { x: s.body.position.x + 1, y: F, z: s.body.position.z };
      T.player.isSneaking = true;
      T.interact(s.entity, null);
      T.tick(2);
      check("crouching with an empty hand doesn't climb on", s.currentRider() === null);
      T.player.isSneaking = false;
      T.interact(s.entity, null);
      T.tick(2);
      check("...standing up, an empty hand climbs back on", s.currentRider() === T.player);
      s.entity.riders = []; T.player.ridingOn = null;
      // the data-driven path: the entity's own interaction sets the property, the script follows
      const s2 = spawnHere();
      T.tick(2);
      s2.entity.triggerEvent("arachno:tamer_used");
      T.tick(2);
      check("tamed via the entity's own interaction too", s2.tamed);
    } else if (CASE === "poison") {
      const { camoFor } = await import("/camo.js");
      const s = spawnHere("poison");
      T.tick(2);
      const hp = () => s.entity.getComponent("minecraft:health").currentValue;
      check("poison has 500 hp", hp() === 500, `hp=${hp()}`);
      check("every leg is warped wart", !!s.body.legTex && s.body.legTex.every((t) => t === camoFor("warped_wart_block").tex));
      T.player.location = { x: -24.5, y: F, z: 0.5 };
      T.tick(60);
      check("fixed size far away (poisonSize 1.0)", Math.abs(s.body.sizeScale - 1.0) < 0.05, `size ${s.body.sizeScale.toFixed(2)}`);
      // let it come for a player standing still: rear up, lunge, bite out of the lunge
      const n0 = T.log.length;
      let lungeAt = -1, frontUp = -9, riseY = 0, y0 = 0, wasLunging = false;
      const bites = [], leaps = [];
      for (let t = 1; t <= 500; t++) {
        const before = T.player.bites;
        T.tick(1);
        if (s.body.isLunging && !wasLunging) leaps.push(t);
        wasLunging = s.body.isLunging;
        if (s.body.isLunging && lungeAt < 0) { lungeAt = t; y0 = s.body.position.y; }
        if (s.body.isLunging && !s.body.isLungeStriking) {
          frontUp = Math.max(frontUp, s.body.legs[0].endEffector.y - s.body.position.y);
          riseY = Math.max(riseY, s.body.position.y - y0);
        }
        if (T.player.bites > before) bites.push(t);
      }
      check("it rears up: body lifts, front feet raised above it", lungeAt > 0 && frontUp > 0 && riseY > 0.1, `lunge at t=${lungeAt}, front foot ${frontUp.toFixed(2)} above the body, body rose ${riseY.toFixed(2)}`);
      check("bites only out of a lunge", bites.length >= 2, `bites at ${bites.slice(0, 5).join(",")}`);
      check("bite = 3 hearts (6) + Poison II for 30 s",
        T.log.some((l) => l.startsWith("player hurt 6 (entityAttack) by arachno:spider")) && T.log.some((l) => l === "effect poison 600 1"));
      const gaps = leaps.slice(1).map((t, i) => t - leaps[i]);
      check("one leap every 3 s, at most one bite per leap", gaps.every((g) => g >= 60) && bites.length <= leaps.length,
        `${leaps.length} leaps (gaps ${gaps.slice(0, 4).join(",")}), ${bites.length} bites`);
      check("squishes like warped wart", T.log.slice(n0).some((l) => l === `sound ${camoFor("warped_wart_block").step}`), camoFor("warped_wart_block").step);
      const h0 = hp(); s.entity.applyDamage(4, { cause: "lava" });
      check("it burns in lava (only netherite is fireproof)", Math.abs((h0 - hp()) - 4) < 1e-9);
    } else if (CASE === "hunter") {
      const { camoFor } = await import("/camo.js");
      const s = spawnHere("hunter");
      T.tick(2);
      const hp = () => s.entity.getComponent("minecraft:health").currentValue;
      check("hunter has 400 hp", hp() === 400, `hp=${hp()}`);
      check("every leg is black concrete", !!s.body.legTex && s.body.legTex.every((t) => t === camoFor("black_concrete").tex));
      // watched from afar: dead still
      T.player.location = { x: s.body.position.x - 26, y: F, z: s.body.position.z };
      T.setView({ x: 1, y: 0, z: 0 });
      T.tick(40);
      check("it spots you and hunts", s.ai.isChasing());
      const a = s.body.position.copy();
      T.tick(60);
      const moved = Math.hypot(s.body.position.x - a.x, s.body.position.z - a.z);
      check("watched from afar, it freezes", moved < 0.5, `moved ${moved.toFixed(2)} in 3 s`);
      check("fixed size far away (hunterSize 1.1)", Math.abs(s.body.sizeScale - 1.1) < 0.05, `size ${s.body.sizeScale.toFixed(2)}`);
      // look away: it comes, in silence
      const d0 = hdist(s.body.position, T.player.location);
      T.setView({ x: -1, y: 0, z: 0 });
      const n0 = T.log.length;
      T.tick(30);
      const d1 = hdist(s.body.position, T.player.location);
      check("unwatched, it closes in", d0 - d1 > 3, `${d0.toFixed(1)} -> ${d1.toFixed(1)} blocks`);
      check("silent: no footsteps, no landings", !T.log.slice(n0).some((l) => /^sound (step|fall)\./.test(l)));
      // blindness: within 16 blocks while it hunts, topped up every 2 s
      T.player.location = { x: s.body.position.x - 10, y: F, z: s.body.position.z };
      T.setView({ x: 1, y: 0, z: 0 });   // watched at 10 blocks: frozen, but you are in range
      const n1 = T.log.length;
      T.tick(130);
      const blinds = T.log.slice(n1).filter((l) => l === "effect blindness 600 0").length;
      check("blinds you within 16 blocks, topped up every 2 s", blinds >= 3 && blinds <= 4, `${blinds} doses in 6.5 s`);
      T.player.location = { x: s.body.position.x - 30, y: F, z: s.body.position.z };
      const n2 = T.log.length;
      T.tick(100);
      check("out of range, no more blindness", !T.log.slice(n2).some((l) => l.startsWith("effect blindness")));
      // inside commit range your eyes don't help: it takes you anyway
      T.player.location = { x: s.body.position.x - 4, y: F, z: s.body.position.z };
      const bites0 = T.player.bites;
      T.tick(120);
      check("inside 6 blocks, watching doesn't stop it", T.player.bites > bites0 && T.log.some((l) => l.startsWith("player hurt 8 (entityAttack)")), `${T.player.bites - bites0} bites`);
    } else if (CASE === "enrage") {
      const { ItemStack } = await import("@minecraft/server");
      const { scaleToSpeedFactor } = await import("/mob.js");
      const spec = await (await fetch("/bp/entities/spider.json")).json();
      const boss = spec["minecraft:entity"].component_groups["arachno:enraged"]["minecraft:boss"];
      check("the boss bar is named as in Java", boss && boss.name === "Enraged Netherite Spider", JSON.stringify(boss));
      setConfig("netheriteDropChance", 0);   // the block must come anyway
      const s = spawnHere();
      T.tick(2);
      const hpc = () => s.entity.getComponent("minecraft:health");
      s.entity.applyDamage(50, { cause: "magic" });   // 350 -> 300: damage is NOT forgiven
      T.player.slots[0] = new ItemStack("minecraft:netherite_ingot", 3);
      const n0 = T.log.length, p0 = { ...T.counts };
      T.interact(s.entity, "minecraft:netherite_ingot");
      T.tick(2);
      check("a netherite ingot enrages the netherite variant", s.enraged && s.entity.groups.has("arachno:enraged"));
      check("health topped up by the bonus, damage kept: 300 + 350 = 650 of 700",
        Math.abs(s.realHealth() - 650) < 1e-6 && Math.abs(hpc().currentValue / hpc().effectiveMax - 650 / 700) < 1e-6,
        `real ${s.realHealth().toFixed(1)}, bar ${(100 * hpc().currentValue / hpc().effectiveMax).toFixed(1)}%`);
      check("the ingot is used up (survival)", T.player.slots[0] && T.player.slots[0].amount === 2, `${T.player.slots[0] && T.player.slots[0].amount} left`);
      const dust = (T.counts["p:minecraft:redstone_wire_dust_particle"] || 0) - (p0["p:minecraft:redstone_wire_dust_particle"] || 0);
      const sparks = (T.counts["p:minecraft:electric_spark_particle"] || 0) - (p0["p:minecraft:electric_spark_particle"] || 0);
      check("ignition: thunder, red dust, sparks", T.log.slice(n0).includes("sound ambient.weather.thunder") && dust >= 60 && sparks >= 40, `dust ${dust}, sparks ${sparks}`);
      // armour still applies, then the hit is counted in the boss pool's points
      const before = s.realHealth();
      s.entity.applyDamage(7, { cause: "entityAttack" });
      check("still wears the netherite suit (7 -> ~1.79), bar moves by the real damage",
        Math.abs((before - s.realHealth()) - 1.792) < 0.01, `took ${(before - s.realHealth()).toFixed(3)} real`);
      T.interact(s.entity, "minecraft:netherite_ingot");
      T.tick(2);
      check("a second ingot does nothing and is kept", T.player.slots[0].amount === 2);
      // the aura, the speed, the bite
      const a0 = T.counts["p:minecraft:blue_flame_particle"] || 0;
      const bites = [];
      for (let t = 1; t <= 300; t++) { const b = T.player.bites; T.tick(1); if (T.player.bites > b) bites.push(t); }
      check("it wears the storm (soul flame at its feet)", (T.counts["p:minecraft:blue_flame_particle"] || 0) - a0 >= 10);
      const want = scaleToSpeedFactor(s.body.sizeScale) * 1.5;
      // (setSpeedScale skips changes under 0.1%, as in Java, so it may trail by that much)
      check("1.5x chase speed", s.ai.isChasing() && Math.abs(s.body.speedScale / want - 1) <= 0.0015, `speedScale ${s.body.speedScale.toFixed(4)} want ${want.toFixed(4)}`);
      check("a 10-heart bite", bites.length > 0 && T.log.some((l) => l.startsWith("player hurt 20 (entityAttack)")), `bites at ${bites.slice(0, 3).join(",")}`);
      // the payout
      s.entity.applyDamage(100000, { cause: "magic" });
      T.tick(3);
      check("slain, it always drops a FULL netherite block", T.log.some((l) => l.startsWith("item minecraft:netherite_block")) && !T.log.some((l) => l.startsWith("item minecraft:netherite_ingot")));
      // creative keeps the ingot; tamed and the other variants can't be enraged
      T.player.gameMode = "Creative";
      const c = spawnHere();
      T.tick(2);
      T.interact(c.entity, "minecraft:netherite_ingot");
      T.tick(2);
      check("in Creative the ingot is kept", c.enraged && T.player.slots[0].amount === 2);
      T.player.gameMode = "Survival";
      const t = spawnHere();
      T.tick(2);
      T.interact(t.entity, "arachno:spider_tamer");
      T.tick(2);
      T.interact(t.entity, "minecraft:netherite_ingot");
      T.tick(2);
      const cam = spawnHere("camo");
      T.tick(2);
      T.interact(cam.entity, "minecraft:netherite_ingot");
      T.tick(2);
      check("a tamed spider and the camo variant can't be enraged", t.tamed && !t.enraged && !cam.enraged && T.player.slots[0].amount === 2);
    } else if (CASE === "permadeath") {
      const { world } = await import("@minecraft/server");
      setConfig("permadeath", true);
      setConfig("spawnMinMinutes", 0.05); setConfig("spawnMaxMinutes", 0.05);
      const s = spawnHere();
      T.tick(2);
      s.entity.applyDamage(100000, { cause: "entityAttack" });
      T.tick(3);
      check("the kill is saved with the world", sm.kills() === 1 && world.getDynamicProperty("arachno:kills") === 1, `kills ${sm.kills()}, saved ${world.getDynamicProperty("arachno:kills")}`);
      T.tick(60 * 60 * 20);   // an hour
      check("with permadeath on, it never comes back", spiders().length === 0 && sm.respawnTimer === -1, `${spiders().length} spiders, timer ${sm.respawnTimer}`);
      const egg = spawnHere();
      T.tick(2);
      check("a spawn egg still works", spiders().length === 1 && egg.alive);
      egg.entity.applyDamage(100000, { cause: "entityAttack" });
      T.tick(3);
      check("that kill counts too", sm.kills() === 2);
      setConfig("permadeath", false);
      T.tick(200);
      check("permadeath off: the hunt resumes", spiders().length === 1, `${spiders().length} spiders`);
    } else if (CASE === "legs") {
      const results = [];
      let ok = true;
      for (const n of [1, 2, 3, 4, 5, 6, 12, 16]) {
        setConfig("netheriteLegs", n);
        T.player.location = { x: 0.5, y: F, z: 0.5 };
        const s = spawnHere();
        T.tick(2);
        const x0 = s.body.position.x;
        T.player.location = { x: s.body.position.x + 24, y: F, z: 0.5 };
        T.tick(100);
        const moved = s.body.position.x - x0;
        const good = s.body.legs.length === n && s.renderer.liveCount() === n && moved > 3 && Number.isFinite(s.body.position.y);
        if (!good) ok = false;
        results.push(`${n}:${s.body.legs.length}legs/${moved.toFixed(1)}b`);
      }
      check("netheriteLegs 1-16: every count builds, draws and walks", ok, results.join(" "));
      // posture at a fixed size: 1-2 legs can't hold the body up and drag it (Java's crawl); 3+ walk upright
      setConfig("minSize", 1); setConfig("maxSize", 1);
      const posture = {};
      for (const n of [1, 2, 3, 8]) {
        setConfig("netheriteLegs", n);
        T.player.location = { x: 0.5, y: F, z: 0.5 };
        const s = spawnHere();
        T.tick(2);

      T.player.location = { x: 300.5, y: F, z: 0.5 };   // nobody near: it idles
      const s = spawnHere();
      let groomed = 0, breathe = [];
      for (let t = 0; t < 400; t++) {
        T.tick(1);
        if (s.body.groomingTimer > 0) groomed++;
        if (t > 100) breathe.push(s.body.position.y);
      }
      check("an idle spider grooms", groomed > 50, `${groomed} ticks grooming`);
      check("front legs return to the gait afterwards", s.body.groomingTimer > 0 || (!s.body.legs[0].isDisabled && !s.body.legs[1].isDisabled));
      check("it breathes (body bobs while still)", Math.max(...breathe) - Math.min(...breathe) > 0.01, `bob ${(Math.max(...breathe) - Math.min(...breathe)).toFixed(3)}`);
    }
    check("no API misuse", T.errors.length === 0, T.errors.slice(0, 3).join("; "));
  } catch (e) {
    lines.push("CRASH " + e + "\n" + (e.stack || ""));
  }
  out.textContent = `case=${CASE}\n` + lines.join("\n");
</script>
