<!doctype html>
<meta charset="utf-8">
<title>Raycast quirk regression</title>
<script type="importmap">{ "imports": { "@minecraft/server": "/test/mcstub.js", "@minecraft/server-ui": "/test/mcuistub.js" } }</script>
<pre id="out">running...</pre>
<script type="module">
  // Runs the two Java-verified scenarios through the REAL platform.js (BedrockLevel) over a fake
  // dimension whose native getBlockFromRay misbehaves at the edges in the ways Bedrock might.
  // Every mode must reproduce the Java engine's trace exactly.
  const { Vec3 } = await import("/engine/vec.js");
  const { netheriteSpider } = await import("/engine/presets.js");
  const { SpiderBody } = await import("/engine/body.js");
  const { applyBehaviour, TargetBehaviour } = await import("/engine/behaviour.js");
  const { BedrockLevel } = await import("/platform.js");
  const FLOOR = 201;

  const JAVA = {
    straight: [
      "t=20 pos=(5.401, 1.101, 0.500) yawDeg=90.0 grounded=6/8 steps=18",
      "t=40 pos=(12.257, 1.100, 0.500) yawDeg=90.0 grounded=6/8 steps=41",
      "t=60 pos=(19.110, 1.100, 0.500) yawDeg=90.0 grounded=6/8 steps=64",
      "t=80 pos=(25.957, 1.100, 0.500) yawDeg=90.0 grounded=6/8 steps=87",
      "t=100 pos=(32.781, 1.100, 0.500) yawDeg=90.0 grounded=6/8 steps=110",
      "t=120 pos=(38.373, 1.100, 0.500) yawDeg=90.0 grounded=7/8 steps=134",
      "t=140 pos=(38.373, 1.100, 0.500) yawDeg=90.0 grounded=8/8 steps=136",
      "t=240 pos=(38.373, 1.100, 0.500) yawDeg=90.0 grounded=8/8 steps=136",
    ],
    turn: [
      "t=20 pos=(-3.149, 1.101, -4.017) yawDeg=126.0 grounded=6/8 steps=16",
      "t=40 pos=(-7.058, 1.076, -8.752) yawDeg=153.5 grounded=7/8 steps=37",
      "t=60 pos=(-10.617, 1.098, -13.097) yawDeg=168.2 grounded=6/8 steps=57",
      "t=80 pos=(-14.188, 1.100, -17.578) yawDeg=-172.0 grounded=7/8 steps=76",
      "t=100 pos=(-17.535, 1.100, -21.778) yawDeg=-162.9 grounded=6/8 steps=95",
      "t=120 pos=(-19.275, 1.100, -23.962) yawDeg=-141.5 grounded=8/8 steps=110",
      "t=300 pos=(-19.275, 1.100, -23.962) yawDeg=-141.5 grounded=8/8 steps=110",
    ],
  };

  function makeDimension(mode) {
    return {
      getBlockFromRay(loc, dir, opts) {
        const len = Math.hypot(dir.x, dir.y, dir.z);
        const d = { x: dir.x / len, y: dir.y / len, z: dir.z / len };
        if (!(d.y < 0) || loc.y < FLOOR) return undefined;
        const t = (FLOOR - loc.y) / d.y;
        const max = opts.maxDistance;
        if (mode.minLength && max < 0.05) return undefined;
        if (mode.exclusive) { if (!(t > 1e-9 && t < max - 1e-9)) return undefined; }
        else if (t < 0 || t > max) return undefined;
        const hx = loc.x + d.x * t, hz = loc.z + d.z * t;
        const bx = Math.floor(hx), bz = Math.floor(hz), by = FLOOR - 1;
        const faceLocation = { x: hx - bx, y: mode.wrapped ? 0 : 1, z: hz - bz };   // real Bedrock: Up hits report y = 0
        return { block: { location: { x: bx, y: by, z: bz } }, face: "Up", faceLocation };
      },
      getBlock(p) { return { isAir: p.y >= FLOOR, isLiquid: false }; },
      playSound() {},
    };
  }

  function run(level, target, ticks, sample) {
    const o = netheriteSpider(8);
    const body = SpiderBody.fromSpawn(level, new Vec3(0.5, FLOOR + 1.5, 0.5), -90, 0, o.bodyPlan, o.gallopGait, o.walkGait);
    body.javaWalk = true;   // compared against Java traces: Java's exact walk rule
    const behaviour = new TargetBehaviour(target, 2.2);
    let steps = 0; const wasMoving = []; const lines = [];
    for (let t = 1; t <= ticks; t++) {
      body.update();
      applyBehaviour(body, behaviour);
      body.legs.forEach((l, i) => { if (wasMoving[i] && !l.isMoving) steps++; wasMoving[i] = l.isMoving; });
      if (sample.includes(t)) {
        const g = body.legs.filter((l) => l.isGrounded()).length;
        const e = body.orientation.getEulerAnglesYXZ();
        lines.push(`t=${t} pos=(${body.position.x.toFixed(3)}, ${(body.position.y - FLOOR).toFixed(3)}, ${body.position.z.toFixed(3)}) yawDeg=${(e.y * 180 / Math.PI).toFixed(1)} grounded=${g}/8 steps=${steps}`);
      }
    }
    return lines;
  }

  const modes = {
    exact: {},
    exclusiveEnds: { exclusive: true },
    noShortRays: { minLength: true },
    wrappedTopFace: { wrapped: true },
    observedBedrock: { wrapped: true, exclusive: true, minLength: true },
  };
  const report = {};
  for (const [name, mode] of Object.entries(modes)) {
    const level = new BedrockLevel(makeDimension(mode));
    const s = run(level, new Vec3(40.5, FLOOR, 0.5), 240, [20, 40, 60, 80, 100, 120, 140, 240]);
    const tl = run(level, new Vec3(-20.5, FLOOR, -25.5), 300, [20, 40, 60, 80, 100, 120, 300]);
    const okS = JSON.stringify(s) === JSON.stringify(JAVA.straight);
    const okT = JSON.stringify(tl) === JSON.stringify(JAVA.turn);
    report[name] = okS && okT ? "MATCHES JAVA" : { straightOk: okS, turnOk: okT, straight: s, turn: tl };
  }
  // The OLD platform (before the fix) under the same quirks, to prove the quirk breaks it.
  report.oldPlatformUnderNoShortRays = (() => {
    const dim = makeDimension({ minLength: true });
    const old = {
      raycastGround(start, direction, maxDistance) {
        if (direction.lengthSquared() === 0 || !(maxDistance > 0)) return null;
        const dir = direction.copy().normalize();
        const hit = dim.getBlockFromRay(start, dir, { maxDistance });
        if (!hit) return null;
        const b = hit.block.location;
        return new Vec3(b.x + hit.faceLocation.x, b.y + hit.faceLocation.y, b.z + hit.faceLocation.z);
      },
      resolveCollision(position, direction) {
        const start = position.copy().sub(direction);
        const hit = this.raycastGround(start, direction, direction.length());
        return hit ? { position: hit, offset: hit.copy().sub(position) } : null;
      },
      isOnGround(position, down) { const start = position.copy().add(down.copy().normalize().mul(-0.005)); return this.raycastGround(start, down, 0.02) !== null; },
      isPassableAt(p) { return p.y >= FLOOR; },
    };
    return run(old, new Vec3(40.5, FLOOR, 0.5), 120, [60, 120]);
  })();
  document.getElementById("out").textContent = JSON.stringify(report, null, 1);
</script>
